version: "3.9"

services:
  # ─── Infrastructure ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clip_generation
      POSTGRES_USER: clips
      POSTGRES_PASSWORD: ${PG_PASSWORD:-clips_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  # ─── API & Orchestrator ───────────────────────────────────
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: clip_generation
      PG_USER: clips
      PG_PASSWORD: ${PG_PASSWORD:-clips_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: brohit-clips
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      - postgres
      - redis
      - minio

  # ─── Python Workers ──────────────────────────────────────
  worker-preprocess:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    command: python -m workers.preprocessing.worker
    environment: &worker-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: brohit-clips
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      - redis
      - minio

  worker-alignment:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker-gpu
    command: python -m workers.alignment.worker
    environment: *worker-env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - minio

  worker-stylize:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker-gpu
    command: python -m workers.stylization.worker
    environment: *worker-env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - minio

  worker-animate:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker-gpu
    command: python -m workers.animation.worker
    environment: *worker-env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - minio

  worker-render:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    command: python -m workers.render.worker
    environment: *worker-env
    depends_on:
      - redis
      - minio

volumes:
  pgdata:
  miniodata:
